<!DOCTYPE html>
<html>
  <head>
    <meta charset="UTF-8" />
    <title>系统设置 - AresBot</title>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      body {
        font-family: "Segoe UI", Arial, sans-serif;
        background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        min-height: 100vh;
        padding: 20px;
      }
      .container {
        max-width: 800px;
        margin: 0 auto;
        background: white;
        border-radius: 12px;
        box-shadow: 0 10px 40px rgba(0, 0, 0, 0.2);
        padding: 30px;
      }
      .header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 30px;
        padding-bottom: 20px;
        border-bottom: 2px solid #eee;
      }
      h1 {
        color: #333;
        font-size: 24px;
      }
      .back-link {
        color: #667eea;
        text-decoration: none;
        font-weight: 600;
      }
      .back-link:hover {
        text-decoration: underline;
      }
      .settings-section {
        margin-bottom: 30px;
      }
      .settings-section h2 {
        color: #333;
        font-size: 18px;
        margin-bottom: 15px;
        padding-bottom: 10px;
        border-bottom: 1px solid #eee;
      }
      .form-group {
        margin-bottom: 20px;
      }
      .form-group label {
        display: block;
        font-weight: 600;
        margin-bottom: 8px;
        color: #555;
      }
      .form-group input {
        width: 100%;
        padding: 12px;
        border: 2px solid #ddd;
        border-radius: 6px;
        font-size: 14px;
        transition: border-color 0.3s;
      }
      .form-group input:focus {
        outline: none;
        border-color: #667eea;
      }
      .form-group .hint {
        font-size: 12px;
        color: #888;
        margin-top: 5px;
      }
      .btn {
        padding: 12px 24px;
        border: none;
        border-radius: 6px;
        font-size: 16px;
        cursor: pointer;
        transition: all 0.3s;
        font-weight: 600;
      }
      .btn-primary {
        background: #667eea;
        color: white;
      }
      .btn-primary:hover {
        background: #5568d3;
      }
      .btn-secondary {
        background: #6c757d;
        color: white;
      }
      .btn-secondary:hover {
        background: #5a6268;
      }
      .message {
        padding: 12px 15px;
        border-radius: 6px;
        margin-bottom: 20px;
      }
      .message.success {
        background: #d4edda;
        color: #155724;
        border: 1px solid #c3e6cb;
      }
      .message.error {
        background: #f8d7da;
        color: #721c24;
        border: 1px solid #f5c6cb;
      }
      .btn-group {
        display: flex;
        gap: 10px;
        margin-top: 20px;
      }
    </style>
  </head>
  <body>
    <div class="container">
      <div class="header">
        <h1>⚙️ 系统设置</h1>
        <a href="/" class="back-link">← 返回控制台</a>
      </div>

      {% if message %}
      <div class="message {{ msg_type }}">{{ message }}</div>
      {% endif %}

      <div class="settings-section">
        <h2>🔔 钉钉通知设置</h2>
        <form method="POST" action="/system_settings">
          <div class="form-group">
            <label>钉钉机器人 Access Token</label>
            <input
              type="text"
              name="dingtalk_access_token"
              value="{{ dingtalk_access_token or '' }}"
              placeholder="请输入钉钉机器人的 access_token"
            />
            <p class="hint">
              在钉钉群中添加自定义机器人后，从 Webhook 地址中获取 access_token 参数。
              机器人需要设置关键词"ares"。
            </p>
          </div>
          <div class="btn-group">
            <button type="submit" class="btn btn-primary">保存设置</button>
            <button type="button" class="btn btn-secondary" onclick="testDingTalk()">测试通知</button>
          </div>
        </form>
      </div>
    </div>

    <script>
      function testDingTalk() {
        fetch('/api/test_dingtalk', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' }
        })
        .then(res => res.json())
        .then(data => {
          if (data.success) {
            alert('✅ 测试消息发送成功！');
          } else {
            alert('❌ 发送失败: ' + (data.message || '未知错误'));
          }
        })
        .catch(err => {
          alert('❌ 请求失败: ' + err);
        });
      }
    </script>
  </body>
</html>
