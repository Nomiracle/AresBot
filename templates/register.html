<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>AresBot 注册</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: 'Segoe UI', Arial, sans-serif;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
    }
    .box {
      background: white;
      padding: 40px;
      border-radius: 12px;
      box-shadow: 0 10px 40px rgba(0,0,0,0.2);
      width: 100%;
      max-width: 420px;
    }
    h1 { text-align: center; margin-bottom: 30px; color: #333; }
    .input-group { margin-bottom: 16px; }
    .input-group label { display: block; margin-bottom: 6px; color: #555; font-weight: 600; }
    .input-group input {
      width: 100%;
      padding: 12px;
      border: 2px solid #ddd;
      border-radius: 6px;
      font-size: 14px;
    }
    .btn {
      width: 100%;
      padding: 12px;
      background: #28a745;
      color: white;
      border: none;
      border-radius: 6px;
      font-size: 16px;
      cursor: pointer;
      font-weight: 600;
    }
    .btn:hover { background: #218838; }
    .link { display: block; margin-top: 12px; text-align: center; color: #667eea; text-decoration: none; }
    .link:hover { text-decoration: underline; }
    .error { color: #dc3545; margin-bottom: 15px; text-align: center; }
    .security-badge { display:inline-block; background:#28a745; color:#fff; padding:4px 8px; border-radius:4px; font-size:11px; margin-left:5px; }
  </style>
</head>
<body>
  <div class="box">
    <h1>⚔️ AresBot <span class="security-badge">🔒 加密</span></h1>
    {% if error %}
    <div class="error">{{ error }}</div>
    {% endif %}
    <form method="POST">
      <div class="input-group">
        <label>用户名</label>
        <input type="text" name="username" required autofocus>
      </div>
      <div class="input-group">
        <label>密码</label>
        <input type="password" name="password" required>
      </div>
      <div class="input-group">
        <label>确认密码</label>
        <input type="password" name="confirm_password" required>
      </div>
      <button type="submit" class="btn">注册</button>
    </form>
    <a class="link" href="/login">返回登录</a>
    <div style="text-align:center; margin-top:15px; padding-top:15px; border-top:1px solid #eee;">
      <a href="https://github.com/Nomiracle/AresBot" target="_blank" style="color:#666; text-decoration:none; font-size:13px; display:inline-flex; align-items:center; gap:5px;">
        <svg height="16" width="16" viewBox="0 0 16 16" fill="currentColor">
          <path d="M8 0C3.58 0 0 3.58 0 8c0 3.54 2.29 6.53 5.47 7.59.4.07.55-.17.55-.38 0-.19-.01-.82-.01-1.49-2.01.37-2.53-.49-2.69-.94-.09-.23-.48-.94-.82-1.13-.28-.15-.68-.52-.01-.53.63-.01 1.08.58 1.23.82.72 1.21 1.87.87 2.33.66.07-.52.28-.87.51-1.07-1.78-.2-3.64-.89-3.64-3.95 0-.87.31-1.59.82-2.15-.08-.2-.36-1.02.08-2.12 0 0 .67-.21 2.2.82.64-.18 1.32-.27 2-.27.68 0 1.36.09 2 .27 1.53-1.04 2.2-.82 2.2-.82.44 1.1.16 1.92.08 2.12.51.56.82 1.27.82 2.15 0 3.07-1.87 3.75-3.65 3.95.29.25.54.73.54 1.48 0 1.07-.01 1.93-.01 2.2 0 .21.15.46.55.38A8.013 8.013 0 0016 8c0-4.42-3.58-8-8-8z"/>
        </svg>
        GitHub
      </a>
    </div>
  </div>
</body>
</html>
